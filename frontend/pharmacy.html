<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharmacy | PharmaLink</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/pharmacy.js"></script>
</head>
<body data-page="pharmacies">
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="page-head on-dark">
      <div class="container">
        <a class="backlink" href="pharmacies.html">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          All pharmacies
        </a>
        <div id="head-content"><h1>Loading</h1></div>
      </div>
    </section>

    <div class="container shop" id="shop">
      <section class="shop__stock" aria-labelledby="stock-title">
        <h2 id="stock-title">Medicines at this pharmacy</h2>
        <form class="toolbar__row shop__filters" id="controls">
          <div class="field">
            <label class="field__label" for="q">Find a medicine here</label>
            <input class="input" id="q" name="q" type="search" placeholder="Medicine name" autocomplete="off">
          </div>
          <label class="check"><input type="checkbox" name="in_stock" id="in_stock" checked>Only in stock</label>
        </form>
        <p class="results__count" id="count" role="status"></p>
        <div id="stock"><div class="skeleton"></div></div>
      </section>

      <aside class="shop__side">
        <div class="map map--small" id="map" role="region" aria-label="Map showing this pharmacy"></div>
        <div id="location"></div>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
